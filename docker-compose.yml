services:
  mysql:
    image: mysql:8.0
    container_name: portfolio-cms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfolio_cms
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - portfolio_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pportfolio"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  portfolio_db_data: